name: "Feature request / 功能请求"
description: "Template structure or account conventions you want to add / 希望新增的模板结构或科目约定"
title: "[feat] "
labels: ["type:feat"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: "Use case / 使用场景"
      description: "What is impossible or awkward with the current template / 当前模板做不到或很别扭的地方"
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: "Expected result / 期望结果"
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: "Boundary check / 边界确认"
      options:
        - label: "The change keeps the core as the only writer; no implicit accounts / 改动保持 Core 是唯一写者，不启用隐式账户"
          required: true
        - label: "The change does not add ledger rules to the plugin / 改动不把账本规则搬进插件"
          required: true
